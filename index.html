<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radha — Divine Mantra Counter</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      background: #ffffff;
      font-family: 'Cormorant Garamond', Georgia, serif;
      overflow-x: hidden;
    }

    /* Background tiled "Radha" text */
    #bg-text {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      pointer-events: none;
      z-index: 0;
      padding: 10px;
    }

    .bg-radha {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      color: rgba(212, 175, 55, 0.22);
      letter-spacing: 3px;
      padding: 5px 8px;
      white-space: nowrap;
      user-select: none;
      transition: color 0.4s ease;
    }

    .bg-radha.lit {
      color: rgba(212, 175, 55, 0.52);
    }

    /* Main layout */
    .main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    /* Header */
    .top-label {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 7px;
      color: #c9a227;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      opacity: 0.75;
    }

    .deity-name {
      font-family: 'Cinzel', serif;
      font-size: clamp(48px, 10vw, 80px);
      font-weight: 600;
      color: #b8860b;
      letter-spacing: 12px;
      line-height: 1;
      margin-bottom: 0.2rem;
    }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      color: #c9a227;
      letter-spacing: 4px;
      opacity: 0.65;
      font-style: italic;
      margin-bottom: 2.2rem;
    }

    .divider {
      width: 140px;
      height: 1px;
      background: linear-gradient(to right, transparent, #d4af37, transparent);
      margin-bottom: 2.5rem;
    }

    /* Counter ring */
    .ring-wrap {
      position: relative;
      margin-bottom: 1rem;
    }

    .counter-ring {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 1.5px solid rgba(212, 175, 55, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.95);
      box-shadow:
        0 0 0 10px rgba(212, 175, 55, 0.04),
        0 0 0 20px rgba(212, 175, 55, 0.02),
        inset 0 0 0 1px rgba(212, 175, 55, 0.1);
      transition: box-shadow 0.4s ease;
    }

    .counter-ring.pulse {
      box-shadow:
        0 0 0 20px rgba(212, 175, 55, 0.14),
        0 0 0 40px rgba(212, 175, 55, 0.05),
        inset 0 0 0 1px rgba(212, 175, 55, 0.25);
    }

    .count-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 80px;
      font-weight: 300;
      color: #b8860b;
      line-height: 1;
      letter-spacing: -3px;
    }

    .count-label {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 4px;
      color: #c9a227;
      opacity: 0.55;
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* Ornament */
    .ornament {
      font-size: 16px;
      color: rgba(212, 175, 55, 0.35);
      letter-spacing: 10px;
      margin: 1.8rem 0;
    }

    /* Session stats */
    .session-row {
      display: flex;
      gap: 40px;
      margin-bottom: 2rem;
    }

    .stat {
      text-align: center;
    }

    .stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      color: #b8860b;
      font-weight: 300;
      display: block;
      line-height: 1;
    }

    .stat-lbl {
      font-family: 'Cinzel', serif;
      font-size: 8px;
      letter-spacing: 2.5px;
      color: #c9a227;
      opacity: 0.5;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Status */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      color: #aaa;
      letter-spacing: 1.5px;
      font-style: italic;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ddd;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .dot.ready   { background: #c9a227; }
    .dot.on      { background: #27ae60; animation: blink 1.2s ease-in-out infinite; }
    .dot.paused  { background: #c9a227; animation: none; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* Buttons */
    .controls {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .btn {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      padding: 11px 26px;
      border-radius: 1px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      border: 1px solid #d4af37;
      background: transparent;
      color: #b8860b;
    }

    .btn:hover  { background: rgba(212, 175, 55, 0.08); }
    .btn:active { transform: scale(0.97); }

    .btn-stop  { border-color: rgba(201, 162, 39, 0.5); color: #c9a227; }
    .btn-reset { border-color: rgba(0, 0, 0, 0.12); color: #bbb; }

    /* Log */
    .log-box {
      width: 100%;
      max-width: 380px;
      background: rgba(212, 175, 55, 0.03);
      border: 0.5px solid rgba(212, 175, 55, 0.18);
      padding: 12px 16px;
      min-height: 60px;
    }

    .log-entry {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      color: rgba(201, 162, 39, 0.65);
      letter-spacing: 1px;
      font-style: italic;
      line-height: 2;
      text-align: center;
    }

    /* Tip footer */
    .tip {
      margin-top: 1.5rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      color: rgba(212, 175, 55, 0.35);
      letter-spacing: 2px;
      text-align: center;
      font-style: italic;
    }

    /* Animations */
    @keyframes bump {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.22); }
      100% { transform: scale(1); }
    }

    .bump { animation: bump 0.25s ease; }
  </style>
</head>
<body>

<div id="bg-text"></div>

<main class="main">
  <p class="top-label">Divine Chant Counter</p>
  <h1 class="deity-name">Radha</h1>
  <p class="subtitle">राधे राधे</p>
  <div class="divider"></div>

  <div class="ring-wrap">
    <div class="counter-ring" id="ring">
      <span class="count-number" id="countNum">0</span>
      <span class="count-label">chants</span>
    </div>
  </div>

  <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>

  <div class="session-row">
    <div class="stat">
      <span class="stat-num" id="sessTime">0:00</span>
      <span class="stat-lbl">Duration</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="perMin">—</span>
      <span class="stat-lbl">Per Minute</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="sessions">0</span>
      <span class="stat-lbl">Sessions</span>
    </div>
  </div>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="statusText">Press Listen to begin</span>
  </div>

  <div class="controls">
    <button class="btn" id="btnListen" onclick="startListening()">Listen</button>
    <button class="btn btn-stop" id="btnStop" onclick="stopListening()" style="display:none">Pause</button>
    <button class="btn btn-reset" onclick="resetAll()">Reset</button>
  </div>

  <div class="log-box">
    <div class="log-entry" id="logText">Say "Radha" clearly to begin counting</div>
  </div>

  <p class="tip">Tab can stay open in the background &nbsp;·&nbsp; Works in Chrome &amp; Edge</p>
</main>

<script>
  // ── Background tiling ──────────────────────────────────────────────
  const bgEl = document.getElementById('bg-text');
  const BG_COUNT = 300;
  for (let i = 0; i < BG_COUNT; i++) {
    const s = document.createElement('span');
    s.className = 'bg-radha';
    s.textContent = 'Radha';
    bgEl.appendChild(s);
  }
  const bgSpans = bgEl.querySelectorAll('.bg-radha');

  function updateBg(n) {
    const lit = n % BG_COUNT;
    bgSpans.forEach((el, i) => el.classList.toggle('lit', i < lit));
  }

  // ── Persist & load state ───────────────────────────────────────────
  function loadState() {
    try {
      return JSON.parse(localStorage.getItem('radha_state') || '{}');
    } catch { return {}; }
  }
  function saveState() {
    localStorage.setItem('radha_state', JSON.stringify({
      count, sessions, history
    }));
  }

  const saved   = loadState();
  let count     = saved.count    || 0;
  let sessions  = saved.sessions || 0;
  let history   = saved.history  || []; // [{date, chants}]

  // ── Elements ───────────────────────────────────────────────────────
  const countEl    = document.getElementById('countNum');
  const dotEl      = document.getElementById('dot');
  const statusEl   = document.getElementById('statusText');
  const ringEl     = document.getElementById('ring');
  const logEl      = document.getElementById('logText');
  const btnListen  = document.getElementById('btnListen');
  const btnStop    = document.getElementById('btnStop');
  const sessTimeEl = document.getElementById('sessTime');
  const perMinEl   = document.getElementById('perMin');
  const sessionsEl = document.getElementById('sessions');

  countEl.textContent    = count;
  sessionsEl.textContent = sessions;
  updateBg(count);

  // Show last session in log on load
  if (history.length) {
    const last = history[history.length - 1];
    logEl.innerHTML = `<div>Last session: ${last.chants} chants on ${last.date}</div>`;
  }

  // ── Recognition state ──────────────────────────────────────────────
  let recognition    = null;
  let listening      = false;
  let startTime      = null;
  let timerTick      = null;
  let logLines       = [];
  let sessionChants  = 0; // chants this active session

  /*
   * KEY FIX — Real-time counting via interim results
   * interimMap tracks how many "radha" hits we already counted
   * for each result-slot index. When the slot goes final, we
   * reconcile so there is NO double counting.
   */
  const interimMap = new Map(); // resultIndex → already-counted hits

  function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function addChants(n) {
    if (n <= 0) return;
    count         += n;
    sessionChants += n;
    countEl.textContent = count;
    countEl.classList.remove('bump');
    void countEl.offsetWidth;
    countEl.classList.add('bump');
    ringEl.classList.add('pulse');
    setTimeout(() => ringEl.classList.remove('pulse'), 500);
    updateBg(count);
    saveState();

    const t = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    logLines.unshift(`+${n} · ${t}`);
    if (logLines.length > 4) logLines.pop();
    logEl.innerHTML = logLines.map(l => `<div>${l}</div>`).join('');
  }

  // ── Start listening ────────────────────────────────────────────────
  function startListening() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      statusEl.textContent = 'Voice recognition not supported — use Chrome or Edge';
      return;
    }

    recognition = new SR();
    recognition.continuous     = true;
    recognition.interimResults = true;  // ← enables real-time results
    recognition.lang           = 'en-IN';
    interimMap.clear();

    recognition.onstart = () => {
      listening = true;
      dotEl.className = 'dot on';
      statusEl.textContent = 'Listening — say Radha';
      btnListen.style.display = 'none';
      btnStop.style.display   = '';

      if (!startTime) {
        sessions++;
        sessionChants = 0;
        sessionsEl.textContent = sessions;
        saveState();
        startTime = Date.now();
        timerTick = setInterval(() => {
          const ms   = Date.now() - startTime;
          const mins = ms / 60000;
          sessTimeEl.textContent = formatTime(ms);
          perMinEl.textContent   = mins > 0.08 ? Math.round(count / mins) : '—';
        }, 500);
      }
    };

    recognition.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const transcript = e.results[i][0].transcript;
        const hits       = (transcript.match(/radha/gi) || []).length;
        const alreadyCounted = interimMap.get(i) || 0;
        const diff = hits - alreadyCounted;

        if (e.results[i].isFinal) {
          // Final: add any remaining diff and clean up slot
          addChants(diff);
          interimMap.delete(i);
        } else {
          // Interim: only add the NEW hits since last interim update
          if (diff > 0) {
            addChants(diff);
            interimMap.set(i, hits);
          }
        }
      }
    };

    recognition.onend = () => {
      // Auto-restart so background use is seamless
      if (listening) {
        try { recognition.start(); } catch (_) {}
      }
    };

    recognition.onerror = (e) => {
      if (e.error === 'not-allowed') {
        statusEl.textContent = 'Microphone access denied — allow it in browser settings';
        stopListening();
      } else if (e.error === 'no-speech') {
        // Harmless — browser will fire onend → auto-restart
      }
    };

    recognition.start();
  }

  // ── Stop listening ─────────────────────────────────────────────────
  function stopListening() {
    listening = false;
    if (recognition) { try { recognition.stop(); } catch (_) {} recognition = null; }
    clearInterval(timerTick);

    // Save this session to history
    if (sessionChants > 0) {
      const dateStr = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      history.push({ date: dateStr, chants: sessionChants });
      if (history.length > 30) history.shift(); // keep last 30 sessions
    }

    startTime = null;
    interimMap.clear();
    dotEl.className = 'dot paused';
    statusEl.textContent = `Paused · ${count} total chants`;
    btnListen.style.display = '';
    btnStop.style.display   = 'none';
    saveState();
  }

  // ── Reset ──────────────────────────────────────────────────────────
  function resetAll() {
    stopListening();
    count    = 0;
    sessions = 0;
    history  = [];
    logLines = [];
    sessionChants = 0;
    countEl.textContent    = '0';
    sessTimeEl.textContent = '0:00';
    perMinEl.textContent   = '—';
    sessionsEl.textContent = '0';
    logEl.textContent      = 'Say "Radha" clearly to begin counting';
    dotEl.className        = 'dot';
    statusEl.textContent   = 'Press Listen to begin';
    updateBg(0);
    saveState();
  }

  // ── Keep screen alive in background ───────────────────────────────
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(() => {});
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        navigator.wakeLock.request('screen').catch(() => {});
      }
    });
  }
</script>
</body>
</html>

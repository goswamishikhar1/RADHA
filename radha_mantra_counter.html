
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body-wrap {
    display: block;
    min-height: 600px;
    background: #fff;
    font-family: 'Cormorant Garamond', Georgia, serif;
    position: relative;
    overflow: hidden;
    padding: 0;
  }

  .bg-text {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    align-content: flex-start;
    pointer-events: none;
    z-index: 0;
    padding: 8px;
  }

  .bg-radha {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    color: rgba(212, 175, 55, 0.13);
    letter-spacing: 2px;
    padding: 4px 6px;
    white-space: nowrap;
    font-weight: 400;
    user-select: none;
  }

  .main-card {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1.5rem 2rem;
    min-height: 600px;
  }

  .top-title {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 6px;
    color: #c9a227;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
    opacity: 0.8;
  }

  .deity-name {
    font-family: 'Cinzel', serif;
    font-size: 52px;
    font-weight: 600;
    color: #b8860b;
    letter-spacing: 8px;
    text-shadow: 0 0 40px rgba(212,175,55,0.15);
    margin-bottom: 0.15rem;
    line-height: 1;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    color: #c9a227;
    letter-spacing: 3px;
    opacity: 0.7;
    margin-bottom: 2rem;
    font-style: italic;
  }

  .divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(to right, transparent, #d4af37, transparent);
    margin-bottom: 2rem;
  }

  .counter-ring {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 1.5px solid rgba(212,175,55,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.8rem;
    position: relative;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 0 0 8px rgba(212,175,55,0.04), inset 0 0 0 1px rgba(212,175,55,0.1);
    transition: box-shadow 0.3s ease;
  }

  .counter-ring.pulse {
    box-shadow: 0 0 0 16px rgba(212,175,55,0.12), inset 0 0 0 1px rgba(212,175,55,0.2);
  }

  .count-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 72px;
    font-weight: 300;
    color: #b8860b;
    line-height: 1;
    letter-spacing: -2px;
    transition: transform 0.15s ease;
  }

  .count-label {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 3px;
    color: #c9a227;
    opacity: 0.6;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .ornament {
    font-size: 18px;
    color: rgba(212,175,55,0.4);
    letter-spacing: 8px;
    margin-bottom: 2rem;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1.8rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    color: #999;
    letter-spacing: 1px;
    font-style: italic;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ccc;
    transition: background 0.3s;
  }

  .dot.active { background: #c9a227; }
  .dot.listening { background: #27ae60; animation: blink 1.2s infinite; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 10px 22px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid #d4af37;
    background: transparent;
    color: #b8860b;
  }

  .btn:hover { background: rgba(212,175,55,0.08); }
  .btn:active { transform: scale(0.97); }

  .btn-stop {
    border-color: #c9a22780;
    color: #c9a227;
  }

  .btn-reset {
    border-color: rgba(0,0,0,0.12);
    color: #aaa;
  }

  .session-info {
    display: flex;
    gap: 32px;
    margin-bottom: 1.5rem;
  }

  .session-stat {
    text-align: center;
  }

  .session-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: #b8860b;
    font-weight: 300;
    display: block;
  }

  .session-lbl {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 2px;
    color: #c9a227;
    opacity: 0.55;
    text-transform: uppercase;
  }

  .log-box {
    width: 100%;
    max-width: 360px;
    background: rgba(212,175,55,0.03);
    border: 0.5px solid rgba(212,175,55,0.2);
    border-radius: 2px;
    padding: 10px 14px;
    max-height: 72px;
    overflow: hidden;
  }

  .log-entry {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    color: #c9a22799;
    letter-spacing: 1px;
    font-style: italic;
    line-height: 1.8;
    text-align: center;
  }

  .tip {
    margin-top: 1.2rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    color: rgba(212,175,55,0.4);
    letter-spacing: 2px;
    text-align: center;
    font-style: italic;
  }

  .bump {
    animation: bump 0.2s ease;
  }
  @keyframes bump {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
</style>

<h2 class="sr-only" style="position:absolute;left:-9999px">Radha mantra voice counter — say Radha aloud and the count increases</h2>

<body-wrap>
  <div class="bg-text" id="bgText"></div>

  <div class="main-card">
    <div class="top-title">Divine Chant</div>
    <div class="deity-name">Radha</div>
    <div class="subtitle">राधे राधे</div>
    <div class="divider"></div>

    <div class="counter-ring" id="ring">
      <div class="count-number" id="countNum">0</div>
      <div class="count-label">chants</div>
    </div>

    <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>

    <div class="session-info">
      <div class="session-stat">
        <span class="session-num" id="sessionTime">0:00</span>
        <span class="session-lbl">Duration</span>
      </div>
      <div class="session-stat">
        <span class="session-num" id="perMin">0</span>
        <span class="session-lbl">Per Min</span>
      </div>
    </div>

    <div class="status-bar">
      <div class="dot" id="dot"></div>
      <span id="statusText">Press Listen to begin</span>
    </div>

    <div class="controls">
      <button class="btn" id="btnListen" onclick="startListening()">Listen</button>
      <button class="btn btn-stop" id="btnStop" onclick="stopListening()" style="display:none">Stop</button>
      <button class="btn btn-reset" onclick="resetCounter()">Reset</button>
    </div>

    <div class="log-box">
      <div class="log-entry" id="logText">Say "Radha" clearly — it will be counted.</div>
    </div>

    <div class="tip">Works while tab is open in background</div>
  </div>
</body-wrap>

<script>
  const words = Array(200).fill('Radha');
  const bg = document.getElementById('bgText');
  words.forEach(() => {
    const s = document.createElement('span');
    s.className = 'bg-radha';
    s.textContent = 'Radha';
    bg.appendChild(s);
  });

  let count = 0;
  let recognition = null;
  let listening = false;
  let startTime = null;
  let timerInterval = null;
  let logLines = [];

  const countEl = document.getElementById('countNum');
  const dotEl = document.getElementById('dot');
  const statusEl = document.getElementById('statusText');
  const ringEl = document.getElementById('ring');
  const logEl = document.getElementById('logText');
  const btnListen = document.getElementById('btnListen');
  const btnStop = document.getElementById('btnStop');
  const sessionTimeEl = document.getElementById('sessionTime');
  const perMinEl = document.getElementById('perMin');

  function updateBg() {
    const all = bg.querySelectorAll('.bg-radha');
    all.forEach((el, i) => {
      if (count > 0 && i < count % 200) {
        el.style.color = 'rgba(212,175,55,0.28)';
      } else {
        el.style.color = 'rgba(212,175,55,0.10)';
      }
    });
  }

  function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2,'0');
  }

  function startListening() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      statusEl.textContent = 'Voice not supported in this browser';
      return;
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-IN';

    recognition.onstart = () => {
      listening = true;
      dotEl.className = 'dot listening';
      statusEl.textContent = 'Listening — say Radha';
      btnListen.style.display = 'none';
      btnStop.style.display = '';
      if (!startTime) {
        startTime = Date.now();
        timerInterval = setInterval(() => {
          const elapsed = Date.now() - startTime;
          sessionTimeEl.textContent = formatTime(elapsed);
          const mins = elapsed / 60000;
          perMinEl.textContent = mins > 0 ? Math.round(count / mins) : 0;
        }, 1000);
      }
    };

    recognition.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const transcript = e.results[i][0].transcript.toLowerCase();
        if (e.results[i].isFinal) {
          const matches = (transcript.match(/radha/gi) || []).length;
          if (matches > 0) {
            count += matches;
            countEl.textContent = count;
            countEl.classList.remove('bump');
            void countEl.offsetWidth;
            countEl.classList.add('bump');
            ringEl.classList.add('pulse');
            setTimeout(() => ringEl.classList.remove('pulse'), 400);
            updateBg();
            const t = new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'});
            const line = `+${matches} at ${t}`;
            logLines.unshift(line);
            if (logLines.length > 3) logLines.pop();
            logEl.innerHTML = logLines.map(l => `<div>${l}</div>`).join('');
          }
        }
      }
    };

    recognition.onend = () => {
      if (listening) {
        recognition.start();
      }
    };

    recognition.onerror = (e) => {
      if (e.error === 'not-allowed') {
        statusEl.textContent = 'Microphone permission denied';
        listening = false;
        dotEl.className = 'dot';
        btnListen.style.display = '';
        btnStop.style.display = 'none';
      }
    };

    recognition.start();
  }

  function stopListening() {
    listening = false;
    if (recognition) recognition.stop();
    dotEl.className = 'dot active';
    statusEl.textContent = 'Paused — ' + count + ' chants recorded';
    btnListen.style.display = '';
    btnStop.style.display = 'none';
    clearInterval(timerInterval);
  }

  function resetCounter() {
    stopListening();
    count = 0;
    countEl.textContent = '0';
    logLines = [];
    logEl.textContent = 'Say "Radha" clearly — it will be counted.';
    sessionTimeEl.textContent = '0:00';
    perMinEl.textContent = '0';
    startTime = null;
    dotEl.className = 'dot';
    statusEl.textContent = 'Press Listen to begin';
    updateBg();
  }
</script>
